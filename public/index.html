/* Layout: one framed sheet, ttyl-style. Left: a sunset landscape that is the meter (people = members, sky + sun = time, flag = ARR). Right: the count, the one action (add a member), this week's tally, then time and ARR. Single light look on purpose. */

}

:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }

  function closeTip() { pinned = -1; $("tip").hidden = true; $("tip").className = "tip"; }
  function clickScene(e) {
    var g = e.target.closest && e.target.closest(".fig"), sp = e.target.closest && e.target.closest("[data-spot]"), tip = $("tip");
    if (!g && !sp) { closeTip(); return; }
    if (sp) {
      var k = +sp.getAttribute("data-spot");
      pinned = -1; tip.className = "tip"; tip.innerHTML = "<b>spot #" + (k + 1) + "</b> · open · " + esc(ACT[slots()[k].a]); tip.hidden = false; placeTip(sp); return;
    }
    var i = +g.getAttribute("data-i"), info = memberInfo(i);
    pinned = i; tip.className = "tip pinned";
    tip.innerHTML = '<div><b>' + esc(info.title) + '</b><div class="act">' + esc(info.line) + '</div></div>' +
      (isEditor ? '<input class="field" id="tipName" maxlength="40" placeholder="add their name" value="' + esc(nameOf(i + 1)) + '" aria-label="Name for member #' + (i + 1) + '">' +
        '<div class="tiprow"><button class="btn" id="tipSave" type="button">save name</button><button class="linkbtn" id="tipClose" type="button">close</button></div>'
        : '<div class="tiprow"><button class="linkbtn" id="tipClose" type="button">close</button></div>');
    tip.hidden = false; placeTip(g);
    $("tipClose").addEventListener("click", closeTip);
    if (isEditor) {
      var go = function () { renameMember(i + 1, $("tipName").value); };
      $("tipSave").addEventListener("click", go);
      $("tipName").addEventListener("keydown", function (ev) { if (ev.key === "Enter") go(); });
      $("tipName").focus();
    }
  }
  function stamp(next, text) { next.history.push({ t: new Date().toISOString(), text: text }); }
  function renameMember(n, raw) {
    if (saving) return;
    var name = raw.trim().slice(0, 40), next = clone(), old = nameOf(n);
    if (name === old) { closeTip(); return; }
    if (name) next.names[n] = name; else delete next.names[n];
    next.log.forEach(function (r) { if (r.n === n) r.name = name; });
    stamp(next, name ? (old ? "renamed #" + n + " from " + old + " to " + name : "named #" + n + " " + name) : "cleared the name for #" + n);
    S = next; closeTip(); render(-1);
    save(next, name ? "#" + n + " is " + name + " now." : "name cleared.");
  }

  /* ---------------- saving ---------------- */
  function api(method, body) {
    var opts = { method: method, headers: { "content-type": "application/json" }, cache: "no-store" };
    if (PASS) opts.headers["x-passcode"] = PASS;
    if (body) opts.body = JSON.stringify(body);
    return fetch("/api/state", opts).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; }); });
  }
  function adopt(rec) { if (!rec || !rec.state) return false; VERSION = rec.version || 0; S = normalize(rec.state); lastGood = JSON.stringify(S); return true; }
  function normalize(st) {
    if (!st.names) st.names = {};
    if (!st.history) st.history = [];
    if (!st.log) st.log = [];
    return st;
  }
  var toastTimer;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3400); }
  var saving = false;
  function setBusy(b) { $("addBtn").disabled = b; $("saveSettings").disabled = b; $("addBtn").textContent = b ? "saving…" : "welcome them in →"; }
  function save(next, note) {
    if (saving) return;
    if (!PASS) { toast("unlock with your passcode first (owner, at the bottom)."); return; }
    saving = true; setBusy(true);
    api("POST", { state: next, base: VERSION }).then(function (r) {
      saving = false; setBusy(false);
      if (r.status === 200) { VERSION = r.body.version; lastGood = JSON.stringify(next); toast(note); liveText(); return; }
      if (r.status === 409) { adopt(r.body); render(-1); toast("the tracker changed somewhere else, so this shows the latest. try again."); return; }
      if (r.status === 401) { lock(); toast("that passcode didn't work. unlock again to keep editing."); }
      else toast("couldn't save (" + (r.body.error || "server error " + r.status) + "). try again.");
      if (lastGood) S = JSON.parse(lastGood); render(-1);
    }, function () {
      saving = false; setBusy(false);
      toast("couldn't reach the server. check your connection and try again.");
      if (lastGood) S = JSON.parse(lastGood); render(-1);
    });
  }
  function clone() { return JSON.parse(JSON.stringify(S)); }
  function addMember() {
    if (saving) return;
    var next = clone(), name = $("recruitName").value.trim().slice(0, 40);
    next.members += 1;
    next.log.push({ n: next.members, name: name, d: new Date().toISOString() });
    if (name) next.names[next.members] = name;
    stamp(next, "added #" + next.members + (name ? " " + name : "") + " · " + ACT[slots()[next.members - 1] ? slots()[next.members - 1].a : "stand"]);
    S = next; $("recruitName").value = "";
    render(S.members - 1);
    var note = "welcome, " + (name || "member #" + next.members) + ". " + (next.members >= next.goal ? "that's the goal!" : (next.goal - next.members) + " to go.");
    toast(note + " saving…");
    setTimeout(function () { save(next, "saved. " + note); }, 1200);
  }
  function undo() {
    if (saving || !S.log.length) return;
    var next = clone(), gone = next.log.pop();
    delete next.names[gone.n];
    next.members = Math.max(0, next.members - 1);
    stamp(next, "removed #" + gone.n + (gone.name ? " " + gone.name : "") + " (undo)");
    S = next; render(-1);
    save(next, "removed " + (gone.name || "#" + gone.n) + ". tracker updated.");
  }
  function saveSettings() {
    var next = clone(), m = parseInt($("setMembers").value, 10), g = parseInt($("setGoal").value, 10), p = parseFloat($("setPrice").value), d = $("setDeadline").value;
    if (!(g > 0) || !(m >= 0) || !(p >= 0) || !/^\d{4}-\d{2}-\d{2}$/.test(d)) { toast("every setting needs a value, and the goal must be at least 1."); return; }
    var cap = slots().length;
    if (g > cap) { toast("the hill fits " + cap + " people, so keep the goal at " + cap + " or less."); return; }
    if (m > g) { toast("members can't be more than the goal of " + g + "."); return; }
    var changes = [];
    if (m !== S.members) changes.push("members " + S.members + " → " + m);
    if (g !== S.goal) changes.push("goal " + S.goal + " → " + g);
    if (p !== S.pricePerYear) changes.push("price $" + S.pricePerYear + " → $" + p);
    if (d !== S.deadline) changes.push("deadline " + fmtDate(S.deadline + "T12:00:00") + " → " + fmtDate(d + "T12:00:00"));
    next.members = m; next.goal = g; next.pricePerYear = p; next.deadline = d;
    next.log = next.log.filter(function (r) { return r.n <= m; });
    var newNames = {}, named = 0;
    $("setNames").value.split("\n").forEach(function (line, k) { var v = line.trim().slice(0, 40); if (v && k < m) { newNames[k + 1] = v; } });
    for (var key in newNames) if (newNames[key] !== S.names[key]) named++;
    for (var key2 in S.names) if (!newNames[key2] && +key2 <= m) named++;
    next.names = newNames;
    next.log.forEach(function (r) { r.name = newNames[r.n] || ""; });
    if (named) changes.push("updated " + named + (named === 1 ? " name" : " names"));
    if (!changes.length) { toast("nothing changed."); return; }
    stamp(next, changes.join(" · "));
    S = next; render(-1); save(next, "saved for everyone.");
  }

  /* ---------------- share ---------------- */
  function siteUrl() { return location.origin + "/"; }
  function postText() {
    var c = compute();
    var t = S.members >= S.goal ? S.club + " just hit " + S.members + " members and " + money(arr()) + " ARR."
      : S.club + ": " + S.members + "/" + S.goal + " members, " + money(arr()) + " of " + money(goalArr()) + " ARR, " + Math.floor(c.daysLeft) + " days left. " + c.needed + " spots open.";
    return t + "\n" + siteUrl();
  }
  function copy(text, ok) {
    var fallback = function () { toast("couldn't reach the clipboard. here it is: " + text); };
    try { navigator.clipboard.writeText(text).then(function () { toast(ok); }, fallback); } catch (e) { fallback(); }
  }
  var cardBlob = null;
  function makeCard(done) {
    var W = 1080, H = 1350, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    var x = cv.getContext("2d"), c = compute();
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 800 570" width="1080" height="770">' + sceneSvg(c, -1).replace(/class="[^"]*"/g, "") + '</svg>';
    var img = new Image();
    img.onload = function () {
      x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
      x.drawImage(img, 0, 0, W, 770);
      x.strokeStyle = INK; x.lineWidth = 3;
      x.beginPath(); x.moveTo(0, 770); x.lineTo(W, 770); x.stroke();
      x.textBaseline = "alphabetic";
      x.fillStyle = INK; x.font = '500 38px "Pixelify Sans", monospace'; x.fillText("6fc", 60, 842);
      x.fillStyle = "#6b6474"; x.font = '26px "DM Mono", monospace'; x.fillText("the 6 figure club", 148, 840);
      x.textAlign = "right"; x.fillText(c.needed ? c.needed + " spots open" : "full", W - 60, 840); x.textAlign = "left";
      x.fillStyle = INK; x.font = '500 190px "DM Mono", monospace'; x.fillText(String(S.members), 50, 1040);
      var w = x.measureText(String(S.members)).width;
      x.font = '58px "DM Mono", monospace'; x.fillStyle = "#6b6474"; x.fillText("/ " + S.goal + " members", 76 + w, 1040);
      x.beginPath(); x.moveTo(0, 1110); x.lineTo(W, 1110); x.moveTo(W / 2, 1110); x.lineTo(W / 2, H); x.stroke();
      x.fillStyle = "#6b6474"; x.font = '28px "DM Mono", monospace'; x.fillText("time left", 60, 1170); x.fillText("arr", W / 2 + 50, 1170);
      x.fillStyle = INK; x.font = '500 70px "DM Mono", monospace'; x.fillText(Math.floor(c.daysLeft) + " days", 60, 1258); x.fillText(money(arr()), W / 2 + 50, 1258);
      x.fillStyle = "#6b6474"; x.font = '25px "DM Mono", monospace'; x.fillText("ends " + fmtDate(S.deadline + "T12:00:00"), 60, 1300); x.fillText("of " + money(goalArr()), W / 2 + 50, 1300);
      x.lineWidth = 6; x.strokeRect(3, 3, W - 6, H - 6);
      done(cv);
    };
    img.onerror = function () { done(null); };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }
  function openCard() {
    var go = function () {
      makeCard(function (cv) {
        if (!cv) { toast("couldn't draw the share card in this browser."); return; }
        $("cardImg").src = cv.toDataURL("image/png");
        cv.toBlob(function (b) { cardBlob = b; });
        $("saveCard").hidden = false;
        $("cardHint").textContent = "1080 × 1350, sized for instagram and linkedin.";
        $("modal").hidden = false;
      });
    };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go, go);
  }

  /* ---------------- boot ---------------- */
  $("app").innerHTML = MARKUP;
  normalize(S); lastGood = JSON.stringify(S);
  render(-1);
  function refresh() {
    if (saving || pinned >= 0 || document.activeElement === $("setNames")) return;
    api("GET").then(function (r) {
      if (r.status !== 200 || !r.body.state) return;
      if (r.body.version !== VERSION || !VERSION) { adopt(r.body); render(-1); }
    }, function () {});
  }
  refresh();
  setInterval(function () { tick(); liveText(); if (!document.hidden) refresh(); }, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  setInterval(function () { drawScene(-1); }, 600000);

  function lock() { PASS = ""; try { localStorage.removeItem("sfc-pass"); } catch (e) {} showEditor(false); $("ownerBtn").textContent = "owner"; }
  function unlocked() { showEditor(true); $("ownerBtn").textContent = "lock"; $("ownerForm").hidden = true; }
  if (PASS) api("POST", { check: true }).then(function (r) { if (r.status === 200) unlocked(); else lock(); }, function () {});
  $("ownerBtn").addEventListener("click", function () {
    if (PASS) { lock(); toast("locked. editing is off on this device."); return; }
    $("ownerForm").hidden = !$("ownerForm").hidden; if (!$("ownerForm").hidden) $("ownerPass").focus();
  });
  $("ownerForm").addEventListener("submit", function (e) {
    e.preventDefault();
    PASS = $("ownerPass").value;
    api("POST", { check: true }).then(function (r) {
      if (r.status === 200) { try { localStorage.setItem("sfc-pass", PASS); } catch (er) {} $("ownerPass").value = ""; unlocked(); toast("unlocked. you can add members now."); }
      else { PASS = ""; toast(r.status === 401 ? "wrong passcode." : (r.body.error || "couldn't check the passcode.")); }
    }, function () { PASS = ""; toast("couldn't reach the server."); });
  });

  $("addBtn").addEventListener("click", addMember);
  $("recruitName").addEventListener("keydown", function (e) { if (e.key === "Enter") addMember(); });
  $("undoBtn").addEventListener("click", undo);
  $("saveSettings").addEventListener("click", saveSettings);
  $("copyLink").addEventListener("click", function () { copy(siteUrl(), "link copied."); });
  $("copyPost2").addEventListener("click", function () { copy(postText(), "copied. paste it anywhere."); });
  $("cardBtn").addEventListener("click", openCard);
  $("closeModal").addEventListener("click", function () { $("modal").hidden = true; });
  $("modal").addEventListener("click", function (e) { if (e.target === $("modal")) $("modal").hidden = true; });
  $("copyPost").addEventListener("click", function () { copy(postText(), "post text copied."); });
  $("saveCard").addEventListener("click", function () {
    if (!cardBlob) return;
    var file = new File([cardBlob], "6-figure-club.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], text: postText() }).catch(function () {});
      return;
    }
    var url = URL.createObjectURL(cardBlob), a = document.createElement("a");
    a.href = url; a.download = "6-figure-club.png"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast("share card saved.");
  });
  $("scene").addEventListener("pointerover", hoverTip);
  $("scene").addEventListener("click", clickScene);
  $("scene").addEventListener("pointerleave", function () { if (pinned < 0) $("tip").hidden = true; });
  $("histMore").addEventListener("click", function () { histAll = !histAll; renderHistory(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { $("modal").hidden = true; closeTip(); } });

})();
</script>
</body>
</html>
